<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>법률 및 정책 | 몰래주식</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #141414;
      --surface: #1d1d1d;
      --surface-hover: #252525;
      --text: #f5f5f5;
      --muted: #a9a9a9;
      --accent: #2bee34;
      --border: #303030;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    .site-shell {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 56px 0 72px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 16px 0 32px;
      color: var(--muted);
      font-size: 15px;
    }

    .document-list {
      display: grid;
      gap: 12px;
    }

    .document-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .document-link:hover,
    .document-link:focus-visible {
      background: var(--surface-hover);
      border-color: var(--accent);
      outline: none;
    }

    .document-link span:first-child {
      font-size: 17px;
      font-weight: 600;
    }

    .arrow {
      color: var(--accent);
      font-size: 22px;
      line-height: 1;
    }

    @media (max-width: 520px) {
      .site-shell {
        padding-top: 36px;
      }

      .document-link {
        padding: 17px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="site-shell">
    <p class="eyebrow">LEGAL</p>
    <h1>법률 및 정책</h1>
    <p class="intro">몰래주식의 법률 및 정책 문서입니다.</p>

    <nav class="document-list" aria-label="법률 및 정책 문서">
      <a class="document-link" href="privacy.html">
        <span>개인정보 처리방침</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="document-link" href="terms.html">
        <span>서비스 이용약관</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a class="document-link" href="disclaimer.html">
        <span>투자 유의사항</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </nav>
  </main>
</body>

</html>
